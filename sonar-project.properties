# Análise estática no SonarCloud, executada pelo job "sonar" do CI.
sonar.organization=guifreiberger
sonar.projectKey=guifreiberger_sigcf
sonar.projectName=SIGCF
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,backend/test,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx,frontend/src/testes/**
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,frontend/src/testes/**,frontend/android/**

# Mesmos arquivos que o Vitest deixa fora da cobertura.
sonar.coverage.exclusions=backend/src/main.ts,backend/src/database/**,frontend/src/main.tsx
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Migrations são geradas pelo TypeORM e se parecem entre si por natureza.
sonar.cpd.exclusions=backend/src/database/migrations/**

# Exceções revisadas da infraestrutura, com a justificativa em docs/seguranca.md
# ("Decisões de infraestrutura"). Valem só para o arquivo indicado.
sonar.issue.ignore.multicriteria=mysqlRedePublica,mysqlSemIdentidade,papelContribuidor
# MySQL com endpoint público, limitado a serviços do Azure pelo firewall e com TLS obrigatório.
sonar.issue.ignore.multicriteria.mysqlRedePublica.ruleKey=terraform:S6329
sonar.issue.ignore.multicriteria.mysqlRedePublica.resourceKey=infra/base/main.tf
# Identidade gerenciada no MySQL só serve para chave própria de criptografia ou login pelo Entra ID.
sonar.issue.ignore.multicriteria.mysqlSemIdentidade.ruleKey=terraform:S6378
sonar.issue.ignore.multicriteria.mysqlSemIdentidade.resourceKey=infra/base/main.tf
# Contributor só no grupo de recursos do app, para a identidade usada pelos ambientes protegidos do GitHub.
sonar.issue.ignore.multicriteria.papelContribuidor.ruleKey=terraform:S6381
sonar.issue.ignore.multicriteria.papelContribuidor.resourceKey=infra/base/main.tf
