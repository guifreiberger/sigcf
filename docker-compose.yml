services:
  mysql:
    image: mysql:8.0
    container_name: sigcf-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sigcf}
      MYSQL_USER: ${MYSQL_USER:-sigcf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sigcf}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: sigcf-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  # Sistema completo em containers: docker compose --profile app up -d --build
  backend:
    profiles: [app]
    build: ./backend
    container_name: sigcf-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-sigcf}
      DB_PASSWORD: ${MYSQL_PASSWORD:-sigcf}
      DB_NAME: ${MYSQL_DATABASE:-sigcf}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      JWT_EXPIRES_IN_SEGUNDOS: ${JWT_EXPIRES_IN_SEGUNDOS:-28800}
      SEED_SENHA: ${SEED_SENHA:-}

  frontend:
    profiles: [app]
    build: ./frontend
    container_name: sigcf-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:80"

  # Link HTTPS público temporário: docker compose --profile app --profile tunel up -d --build
  tunel:
    profiles: [tunel]
    image: cloudflare/cloudflared:latest
    container_name: sigcf-tunel
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend

volumes:
  mysql_data:
