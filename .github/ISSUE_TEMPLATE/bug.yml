name: Bug
description: Algo não funciona como deveria
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: Descreva o problema e, se possível, anexe um print da tela.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Entrar como motorista
        2. Abrir a coleta de hoje
        3. Tocar em "Concluir coleta"
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: dropdown
    id: perfil
    attributes:
      label: Perfil
      options:
        - Gestor
        - Motorista
        - Os dois
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Aparelho e navegador
      placeholder: "Ex.: Android 15, Chrome 140 / Windows 11, Edge"
