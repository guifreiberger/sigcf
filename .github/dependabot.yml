# Atualizações automáticas de dependências (segurança e versões), em PRs semanais para a develop.
# As versões menores e de correção de cada ecossistema vêm agrupadas num único PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      backend:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      frontend:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: terraform
    directories: [/infra/base, /infra/app]
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
