name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Em pull requests, um push novo cancela a execução desatualizada. Na develop e na main as
# execuções entram na fila, para nunca interromper uma implantação no meio.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sigcf_test
          MYSQL_USER: sigcf
          MYSQL_PASSWORD: sigcf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: sigcf
      DB_PASSWORD: sigcf
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Verificação de tipos
        run: npm run typecheck
      - name: Testes unitários com cobertura (mínimo de 75%)
        run: npm run test:cov
      - name: Testes e2e contra o MySQL
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          npm run test:e2e
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: backend/coverage/lcov.info

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Testes com cobertura (mínimo de 25%)
        run: npm run test:cov
      - name: Build (inclui a verificação de tipos)
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: cobertura-frontend
          path: frontend/coverage/lcov.info

  # Código nativo do app Android: a fila e o envio do trajeto (ADR 0010).
  android:
    name: App Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # O projeto Android usa os plugins do Capacitor instalados pelo npm e gerados pelo sync.
      - name: Gera o projeto Android
        run: npm run build && npx cap sync android
      - name: Testes unitários e lint do app
        working-directory: frontend/android
        run: ./gradlew testHomologacaoDebugUnitTest lintHomologacaoDebug --no-daemon

  imagens:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build da imagem do backend
        run: docker build -t sigcf-backend:ci backend
      - name: Build da imagem do frontend
        run: docker build -t sigcf-frontend:ci frontend

  sonar:
    name: SonarCloud
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo para o Sonar atribuir cada problema ao commit que o introduziu.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: cobertura-backend
          path: backend/coverage
      - uses: actions/download-artifact@v8
        with:
          name: cobertura-frontend
          path: frontend/coverage
      - name: Análise estática e de segurança
        # Fica desligada até o segredo SONAR_TOKEN ser cadastrado no repositório.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  implantacao:
    name: Implantação
    # develop → homologação; main → produção (que espera a aprovação do responsável).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: [backend, frontend, imagens]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'producao' || 'homologacao' }}
      url: ${{ steps.terraform.outputs.url }}
    permissions:
      contents: read
      # Token OIDC trocado por acesso ao Azure: nenhuma senha do Azure fica guardada no GitHub.
      id-token: write
    env:
      AMBIENTE: ${{ github.ref == 'refs/heads/main' && 'producao' || 'homologacao' }}
      VERSAO: ${{ github.sha }}
      REGISTRY: ${{ vars.AZURE_REGISTRY }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    steps:
      - uses: actions/checkout@v7
      - name: Login no Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publica as imagens no registry
        run: |
          az acr login --name "${{ vars.AZURE_REGISTRY_NOME }}"
          docker build -t "$REGISTRY/sigcf-api:$VERSAO" backend
          docker build -t "$REGISTRY/sigcf-web:$VERSAO" frontend
          docker push "$REGISTRY/sigcf-api:$VERSAO"
          docker push "$REGISTRY/sigcf-web:$VERSAO"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Aplica a versão no ambiente
        id: terraform
        working-directory: infra/app
        env:
          TF_VAR_conta_estado: ${{ vars.TF_CONTA_ESTADO }}
          TF_VAR_vapid_chave_publica: ${{ vars.VAPID_PUBLIC_KEY }}
          TF_VAR_vapid_chave_privada: ${{ secrets.VAPID_PRIVATE_KEY }}
          TF_VAR_vapid_contato: ${{ vars.VAPID_CONTATO }}
          TF_VAR_firebase_credenciais: ${{ secrets.FIREBASE_CREDENCIAIS_BASE64 }}
          # Ligue (true) perto das avaliações; desligada, a produção dorme sem acessos.
          TF_VAR_producao_sempre_ligada: ${{ vars.PRODUCAO_SEMPRE_LIGADA == 'true' }}
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=rg-sigcf-estado" \
            -backend-config="storage_account_name=${{ vars.TF_CONTA_ESTADO }}" \
            -backend-config="key=app-$AMBIENTE.tfstate"
          terraform apply -input=false -auto-approve -var "ambiente=$AMBIENTE" -var "versao=$VERSAO"
          echo "url=$(terraform output -raw url)" >> "$GITHUB_OUTPUT"
      - name: Confere se a aplicação está no ar
        # A homologação desliga sem acessos: a primeira requisição a acorda (e roda as migrations).
        run: |
          for tentativa in $(seq 1 30); do
            if curl -fsS "${{ steps.terraform.outputs.url }}/api/health"; then
              echo
              echo "No ar: ${{ steps.terraform.outputs.url }}"
              exit 0
            fi
            sleep 10
          done
          echo "A aplicação não respondeu ao health check." >&2
          exit 1
