# Cabeçalhos de segurança, incluídos em cada location (o nginx não herda add_header
# do server quando a location define o seu próprio).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# A localização é usada pelo próprio app (RF07 e RF11); câmera e microfone, nunca.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
# Só código do próprio site; estilos inline são exigidos pelo React e pelo Leaflet, e os
# tiles do mapa vêm do OpenStreetMap.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
